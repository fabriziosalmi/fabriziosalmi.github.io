<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self'">
    <meta name="description" content="Fabrizio Salmi — open-source project sites hosted on GitHub Pages.">
    <title>Fabrizio Salmi</title>
    <style>
        :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#666; --accent:#0a5c8a; --border:#e6e6e6; }
        @media (prefers-color-scheme: dark){ :root{ --bg:#0d1117; --fg:#e6edf3; --muted:#9aa4ad; --accent:#4aa3d8; --border:#21262d; } }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.65; font-size:16px;
               display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem 1.25rem; }
        .card { max-width:560px; }
        h1 { font-size:1.6rem; margin:0 0 .4rem; letter-spacing:-.01em; }
        p { color:var(--muted); margin:0 0 1.6rem; }
        nav { border-top:1px solid var(--border); padding-top:1.1rem; display:flex; flex-wrap:wrap; gap:.5rem 1.4rem; font-size:.92rem; }
        a { color:var(--accent); text-decoration:none; }
        a:hover { text-decoration:underline; }
        .foot { margin-top:2.4rem; font-size:.8rem; color:var(--muted); }
    </style>
</head>
<body>
    <main class="card">
        <h1>Fabrizio Salmi</h1>
        <p>This host serves the documentation and project sites for my open-source work.
           Each project lives under its own path.</p>
        <nav>
            <a href="https://github.com/fabriziosalmi" rel="me">GitHub profile</a>
            <a href="/privacy">Privacy &amp; legal notice</a>
            <a href="mailto:fabrizio.salmi@gmail.com">Contact</a>
        </nav>
        <p class="foot">Genoa, Italy. No cookies, no analytics, no tracking on any of these pages.</p>
    </main>
</body>
</html>
